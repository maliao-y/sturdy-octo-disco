<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏攻略大全</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif;}
        body {max-width:1200px; margin:0 auto; padding:20px; background:#f5f7fa;}
        nav {background:#222; padding:12px 16px; border-radius:8px; margin-bottom:24px;}
        nav a {color:#fff; text-decoration:none; margin-right:16px; font-size:15px;}
        nav a:hover {color:#42b9ff;}
        h2 {margin:20px 0 12px; color:#111; border-left:4px solid #42b9ff; padding-left:10px;}
        .tag-group {margin:10px 0 20px;}
        .tag-group a {display:inline-block; background:#e0e8f5; padding:4px 12px; border-radius:20px; text-decoration:none; color:#225; margin:4px 6px 4px 0; font-size:14px;}
        .card-wrap {display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px; margin-bottom:30px;}
        .game-card {background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px #00000012;}
        .game-card img {width:100%; height:180px; object-fit:cover; display:block;}
        .card-body {padding:14px;}
        .card-body h3 {font-size:17px; margin-bottom:8px; color:#111;}
        .card-body p {font-size:14px; color:#555; line-height:1.5; margin-bottom:10px;}
        .card-body a {color:#0066cc; text-decoration:none; font-size:14px; font-weight:500;}
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav>

</body>
</html>
